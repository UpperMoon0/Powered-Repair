name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release channel (run on a version tag)
        type: choice
        options: [alpha, beta, release]
        default: alpha
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/release.py preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: dist
          merge-multiple: true
      - name: Publish checked release
        run: python tools/release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ inputs.release_type || 'alpha' }}
          SOURCE_SHA: ${{ github.sha }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-record
          path: dist/*.json
