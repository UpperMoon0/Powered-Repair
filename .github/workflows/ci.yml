name: Build and verify
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :common:test --no-daemon
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: forge-1.12.2, java: '8'}
          - {target: forge-1.16.5, java: '17'}
          - {target: forge-1.20.1, java: '17'}
          - {target: neoforge-1.21.1, java: '21'}
          - {target: neoforge-26.1.2, java: '21'}
          - {target: neoforge-26.2, java: '21'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native module
        working-directory: ${{ matrix.target }}
        run: chmod +x gradlew && ./gradlew build -PdevMods=false --no-daemon --console=plain
      - name: Validate production JAR
        run: python tools/release.py inspect '${{ matrix.target }}'
      - name: Native repair acceptance with development utilities
        timeout-minutes: 15
        env:
          DEV_SMOKE: 'true'
        run: python tools/smoke.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/reports/
            ${{ matrix.target }}/build/neoform/
            ${{ matrix.target }}/run/logs/
            ${{ matrix.target }}/run/crash-reports/
