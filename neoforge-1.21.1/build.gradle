plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
apply from: '../gradle/module.gradle'
def preview = providers.gradleProperty('uiPreview').isPresent()
sourceSets {
    uiPreview {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.240'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        uiPreview {
            client()
            gameDirectory = layout.buildDirectory.dir('ui-preview-run')
            programArguments.addAll('--width','1280','--height','960')
            programArguments.addAll('--quickPlaySingleplayer','RepairPreviewWorld')
        }
    }
    mods { "${identity.mod_id}" { sourceSet(sourceSets.main); if (preview) sourceSet(sourceSets.uiPreview) } }
}
